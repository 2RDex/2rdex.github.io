<script>
async function loadDownloadStats() {
  try {
    const response = await fetch('https://go.2rd.top/api/856635663642132522');
    if (!response.ok) throw new Error('API request failed');
    const result = await response.json();
    if (!result.success || !Array.isArray(result.data)) return;

    result.data.forEach(item => {
      const element = document.getElementById(`count-${item.file_name}`);
      if (element) element.textContent = Number(item.total).toLocaleString();
    });
  } catch (error) {
    console.error('ไม่สามารถดึงข้อมูลสถิติได้:', error);
  }
}

document.addEventListener('DOMContentLoaded', loadDownloadStats);
</script>
