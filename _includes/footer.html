<script>
  async function loadDownloadStats() {
    try {
      // ดึงข้อมูลสถิติจาก Worker API
      const response = await fetch('https://dl.2rd.top/api/stats');
      const result = await response.json();

      // ตรวจสอบว่ามีข้อมูลส่งกลับมาหรือไม่
      if (result && result.data) {
        result.data.forEach(item => {
          // ค้นหา element ตาม ID เช่น count-MCD, count-Bedrock_Thai_Font
          const element = document.getElementById(`count-${item.file_name}`);
          
          if (element) {
            // แปลงตัวเลขใส่คอมม่า (เช่น 1,234)
            element.innerText = Number(item.total).toLocaleString();
          }
        });
      }
    } catch (error) {
      console.error('ไม่สามารถดึงข้อมูลสถิติได้:', error);
    }
  }

  // เรียกทำงานทันทีที่โหลดหน้าเว็บเสร็จ
  document.addEventListener('DOMContentLoaded', loadDownloadStats);
</script>

<!-- บล็อก -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll(".highlight").forEach((highlight) => {

    if (highlight.closest(".code-window")) return;

    const code = highlight.querySelector("code");

    if (!code) return;

    let language = code.dataset.lang || "";

    if (!language) {
      code.classList.forEach((cls) => {
        if (cls.startsWith("language-")) {
          language = cls.replace("language-", "");
        }
      });
    }

    if (!language) {
      const parent = highlight.closest("[class*='language-']");

      if (parent) {
        const match = parent.className.match(
          /language-([a-zA-Z0-9_-]+)/
        );

        if (match) {
          language = match[1];
        }
      }
    }

    const wrapper = document.createElement("div");
    wrapper.className = "code-window";

    const header = document.createElement("div");
    header.className = "code-header";

    header.innerHTML = `
      <div class="code-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="code-language">
        &lt;/&gt; ${language || "Code"}
      </div>

      <button class="code-copy" title="Copy code">
        ⧉
      </button>
    `;

    highlight.parentNode.insertBefore(wrapper, highlight);

    const content = document.createElement("div");
    content.className = "code-content";

    const lineNumbers = document.createElement("div");
    lineNumbers.className = "code-line-numbers";

    /* ลบ newline ที่ติดมาท้ายสุดจาก Markdown/Rouge */
    const codeText = code.innerText.replace(/\r?\n$/, "");

    /* นับจำนวนบรรทัด */
    const lineCount = codeText.split(/\r?\n/).length;

    for (let i = 1; i <= lineCount; i++) {
      const line = document.createElement("div");
      line.textContent = i;
      lineNumbers.appendChild(line);
    }

    wrapper.appendChild(header);
    wrapper.appendChild(content);

    content.appendChild(lineNumbers);
    content.appendChild(highlight);

    const copyButton = header.querySelector(".code-copy");

    copyButton.addEventListener("click", async () => {

      try {
        await navigator.clipboard.writeText(code.innerText);

        copyButton.textContent = "✓";

        setTimeout(() => {
          copyButton.textContent = "⧉";
        }, 1500);

      } catch (error) {
        console.error("ไม่สามารถคัดลอกโค้ดได้:", error);
      }

    });

  });

});
</script>
