<script>
  async function loadDownloadStats() {
    try {
      // ดึงข้อมูลสถิติจาก Worker API
      const response = await fetch('https://link.2rd.top/api/stats');
      const result = await response.json();

      // ตรวจสอบว่ามีข้อมูลส่งกลับมาหรือไม่
      if (result && result.data) {
        result.data.forEach(item => {
          // ค้นหา element ตาม ID เช่น count-MCD, count-Bedrock_Thai_Font
          const element = document.getElementById(`count-${item.file_name}`);
          
          if (element) {
            // แปลงตัวเลขใส่คอมม่า (เช่น 1,234)
            element.innerText = Number(item.total).toLocaleString();
          }
        });
      }
    } catch (error) {
      console.error('ไม่สามารถดึงข้อมูลสถิติได้:', error);
    }
  }

  // เรียกทำงานทันทีที่โหลดหน้าเว็บเสร็จ
  document.addEventListener('DOMContentLoaded', loadDownloadStats);
</script>

<!-- บล็อก -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  document.querySelectorAll(".highlight").forEach((highlight) => {

    if (highlight.closest(".code-window")) return;

    const code = highlight.querySelector("code");

    if (!code) return;

    let language = code.dataset.lang || "";

    if (!language) {
      code.classList.forEach((cls) => {
        if (cls.startsWith("language-")) {
          language = cls.replace("language-", "");
        }
      });
    }

    if (!language) {
      const parent = highlight.closest("[class*='language-']");

      if (parent) {
        const match = parent.className.match(
          /language-([a-zA-Z0-9_-]+)/
        );

        if (match) {
          language = match[1];
        }
      }
    }

    const wrapper = document.createElement("div");
    wrapper.className = "code-window";

    const header = document.createElement("div");
    header.className = "code-header";

    header.innerHTML = `
      <div class="code-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="code-language">
        &lt;/&gt; ${language || "Code"}
      </div>

      <button class="code-copy" title="Copy code">
        ⧉
      </button>
    `;

    highlight.parentNode.insertBefore(wrapper, highlight);

    const content = document.createElement("div");
    content.className = "code-content";

    const lineNumbers = document.createElement("div");
    lineNumbers.className = "code-line-numbers";

    /* ลบ newline ที่ติดมาท้ายสุดจาก Markdown/Rouge */
    const codeText = code.innerText.replace(/\r?\n$/, "");

    /* นับจำนวนบรรทัด */
    const lineCount = codeText.split(/\r?\n/).length;

    for (let i = 1; i <= lineCount; i++) {
      const line = document.createElement("div");
      line.textContent = i;
      lineNumbers.appendChild(line);
    }

    wrapper.appendChild(header);
    wrapper.appendChild(content);

    content.appendChild(lineNumbers);
    content.appendChild(highlight);

    const copyButton = header.querySelector(".code-copy");

    copyButton.addEventListener("click", async () => {

      try {
        await navigator.clipboard.writeText(code.innerText);

        copyButton.textContent = "✓";

        setTimeout(() => {
          copyButton.textContent = "⧉";
        }, 1500);

      } catch (error) {
        console.error("ไม่สามารถคัดลอกโค้ดได้:", error);
      }

    });

  });

});
</script>


<!-- medium-zoom JS -->
<script src="https://cdn.jsdelivr.net/npm/medium-zoom/dist/medium-zoom.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const zoom = mediumZoom(
        '.post-content img, .image-gallery img',
        {
            margin: 24,
            background: 'rgba(0, 0, 0, 0.85)',
            scrollOffset: 0
        }
    );

    const MAX_ZOOM = 5;
    const MIN_ZOOM = 1;

    let activeImage = null;
    let scale = 1;
    let x = 0;
    let y = 0;

    let pointers = new Map();
    let pinchDistance = 0;
    let pinchScale = 1;
    let dragStart = null;
    let moved = false;

    function updateZoom() {
        if (!activeImage) return;

        activeImage.style.scale = scale;
        activeImage.style.translate = `${x}px ${y}px`;
    }

    function setZoom(value) {
        scale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, value));

        if (scale === 1) {
            x = 0;
            y = 0;
        }

        updateZoom();
    }

    function getDistance(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function startZoom(event) {
        const image = zoom.getZoomedImage();
        if (!image) return;

        activeImage = image;
        scale = 1;
        x = 0;
        y = 0;

        image.style.touchAction = 'none';

        image.addEventListener('wheel', onWheel, {
            passive: false
        });

        image.addEventListener('pointerdown', onPointerDown);
        image.addEventListener('pointermove', onPointerMove);
        image.addEventListener('pointerup', onPointerUp);
        image.addEventListener('pointercancel', onPointerUp);
        image.addEventListener('click', onImageClick);

        updateZoom();
    }

    function onWheel(event) {
        event.preventDefault();

        const factor = event.deltaY < 0 ? 1.15 : 0.87;
        setZoom(scale * factor);
    }

    function onPointerDown(event) {
        event.preventDefault();

        activeImage.setPointerCapture(event.pointerId);

        pointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY
        });

        moved = false;

        if (pointers.size === 2) {
            const points = [...pointers.values()];
            pinchDistance = getDistance(points[0], points[1]);
            pinchScale = scale;
            dragStart = null;
        } else {
            dragStart = {
                px: event.clientX,
                py: event.clientY,
                x,
                y
            };
        }
    }

    function onPointerMove(event) {
        if (!pointers.has(event.pointerId)) return;

        pointers.set(event.pointerId, {
            x: event.clientX,
            y: event.clientY
        });

        if (pointers.size === 2) {
            const points = [...pointers.values()];
            const distance = getDistance(points[0], points[1]);

            if (pinchDistance > 0) {
                if (Math.abs(distance - pinchDistance) > 3) {
                    moved = true;
                }

                setZoom(pinchScale * distance / pinchDistance);
            }

        } else if (pointers.size === 1 && scale > 1 && dragStart) {

            const dx = event.clientX - dragStart.px;
            const dy = event.clientY - dragStart.py;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                moved = true;
            }

            x = dragStart.x + dx;
            y = dragStart.y + dy;

            updateZoom();
        }
    }

    function onPointerUp(event) {
        pointers.delete(event.pointerId);

        if (pointers.size === 1) {
            const point = [...pointers.values()][0];

            dragStart = {
                px: point.x,
                py: point.y,
                x,
                y
            };

        } else {
            dragStart = null;
        }
    }

    function onImageClick(event) {
        if (moved) {
            event.stopPropagation();
            event.preventDefault();
            moved = false;
        }
    }

    function cleanupZoom() {
        if (activeImage) {
            activeImage.style.scale = '';
            activeImage.style.translate = '';
            activeImage.style.touchAction = '';

            activeImage.removeEventListener('wheel', onWheel);
            activeImage.removeEventListener('pointerdown', onPointerDown);
            activeImage.removeEventListener('pointermove', onPointerMove);
            activeImage.removeEventListener('pointerup', onPointerUp);
            activeImage.removeEventListener('pointercancel', onPointerUp);
            activeImage.removeEventListener('click', onImageClick);
        }

        activeImage = null;
        pointers.clear();

        scale = 1;
        x = 0;
        y = 0;
        dragStart = null;
        moved = false;
    }

    zoom.on('opened', startZoom);
    zoom.on('closed', cleanupZoom);

});
</script>
