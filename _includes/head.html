<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <meta name="title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="author" content="{{ site.title | escape }}">

  <!-- Canonical -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ page.avatar | absolute_url }}">

  <!-- Theme Color -->
  <meta name="theme-color" content="#b95589">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.ogimage | absolute_url }}">
  <meta property="og:logo" content="{{ page.avatar | absolute_url }}">

  <!-- X (Twitter) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:domain" content="{{site.domain}}">
  <meta property="twitter:url" content="{{site.url}}">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.description | escape }}">
  <meta name="twitter:image" content="{{ page.ogimage | absolute_url }}">

  <!-- Fonts -->
  <link rel="preload" href="{{ '/assets/fonts/CMU-Light.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/CMU-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/CMU-Bold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

  {% if page.layout == nil %}

  <!-- LittleLink -->
  <link rel="stylesheet" href="{{ '/assets/css/reset.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style-2rd.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brands.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brands-extended.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brands-2rd.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/sensitive-content.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  {% elsif page.layout == 'piano' %}

  <!-- Piano Layout CSS -->
  <script src="https://cdn.jsdelivr.net/npm/soundfont-player@0.12.0/dist/soundfont-player.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

  <link rel="stylesheet" href="{{site.url}}/assets/css/piano.css">

  {% else %}

  <!-- Jekyll / Minima -->
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog-custom.css' | relative_url }}">

  {% endif %}

  {%- feed_meta -%}

  {%- seo -%}

  {% if jekyll.environment == "production" and site.google_analytics %}
  {% include google-analytics.html %}
  {% endif %}

</head>
